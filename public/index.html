<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gattitown">
<meta name="theme-color" content="#0a0c0f">
<link rel="manifest" href="manifest.json">
<title>Gattitown Assets</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/sheets.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>

<header>
  <div class="header-top">
    <h1>Gattitown</h1>
    <div class="clock" id="live-clock"></div>
  </div>
  <div class="stat-row">
    <div class="stat-pill c"><div class="num" id="count-critical">0</div><div class="lbl">Critical</div></div>
    <div class="stat-pill h"><div class="num" id="count-high">0</div><div class="lbl">High</div></div>
    <div class="stat-pill m"><div class="num" id="count-medium">0</div><div class="lbl">Medium</div></div>
    <div class="stat-pill w"><div class="num" id="count-monitor">0</div><div class="lbl">Monitor</div></div>
  </div>
</header>

<div class="offline-banner">OFFLINE — changes will sync when connected</div>

<div class="search-bar" id="search-bar">
  <input type="text" id="search-input" placeholder="Search assets & issues...">
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="ALL">All</button>
  <button class="filter-btn" data-filter="CRITICAL">Critical</button>
  <button class="filter-btn" data-filter="HIGH">High</button>
  <button class="filter-btn" data-filter="MEDIUM">Medium</button>
  <button class="filter-btn" data-filter="MONITOR">Monitor</button>
</div>

<main>
  <!-- Issues View -->
  <section class="view active" id="view-issues">
    <div id="board-issues"></div>
  </section>

  <!-- Assets View -->
  <section class="view" id="view-assets">
    <div id="board-assets"></div>
  </section>

  <!-- Menu View -->
  <section class="view" id="view-menu">
    <div id="board-menu"></div>
  </section>
</main>

<!-- FAB -->
<button class="fab" id="fab-btn" aria-label="Add">+</button>

<!-- Detail / Edit Sheet -->
<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-name" id="sheet-name">—</div>
      <div class="priority-badge" id="sheet-badge">—</div>
    </div>
    <div class="sheet-body">
      <div class="view-mode" id="sheet-view-body"></div>
      <div class="edit-mode" id="sheet-edit-body"></div>
    </div>
    <div class="sheet-actions">
      <div class="view-mode btn-row">
        <button class="btn-secondary" id="btn-edit">EDIT</button>
        <button class="btn-secondary" id="btn-close">CLOSE</button>
      </div>
      <button class="btn-resolve view-mode" id="btn-resolve">MARK RESOLVED</button>
      <button class="btn-delete view-mode" id="btn-delete">DELETE</button>
      <div class="edit-mode btn-row">
        <button class="btn-secondary" id="btn-cancel">CANCEL</button>
        <button class="btn-save" id="btn-save">SAVE</button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="Photo">
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-tab active" data-view="issues">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
    Issues
  </button>
  <button class="nav-tab" data-view="assets">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
    Assets
  </button>
  <button class="nav-tab" data-view="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    Menu
  </button>
</nav>

<script type="module">
  import { initSheet } from './js/components/sheet.js';
  initSheet();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
