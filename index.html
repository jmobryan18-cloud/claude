<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gattitown">
<meta name="theme-color" content="#0a0c0f">
<meta name="description" content="Gattitown issue tracking board for equipment and machine status monitoring">
<meta name="format-detection" content="telephone=no">
<meta name="msapplication-TileColor" content="#0a0c0f">
<meta name="msapplication-tap-highlight" content="no">
<link rel="manifest" href="manifest.json">
<title>Gattitown Issues</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --border: #1e2530;
    --critical: #ff2d2d;
    --high: #ff8c00;
    --medium: #f5c400;
    --monitor: #00c2ff;
    --text: #e8eaf0;
    --muted: #4a5568;
    --dim: #1a1f2a;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 200;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .header-top h1 {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
  }

  .clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-align: right;
    line-height: 1.5;
  }

  /* stat row */
  .stat-row {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .stat-pill {
    flex: 1;
    text-align: center;
    border-right: 1px solid var(--border);
    padding: 2px 0;
  }
  .stat-pill:last-child { border-right: none; }

  .stat-pill .num {
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1;
  }
  .stat-pill .lbl {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .stat-pill.c .num { color: var(--critical); }
  .stat-pill.h .num { color: var(--high); }
  .stat-pill.m .num { color: var(--medium); }
  .stat-pill.w .num { color: var(--monitor); }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-btn {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 11px 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    margin-bottom: -1px;
    flex-shrink: 0;
  }
  .filter-btn.active { color: var(--text); border-bottom-color: var(--text); }
  .filter-btn.active[data-filter="CRITICAL"] { color: var(--critical); border-bottom-color: var(--critical); }
  .filter-btn.active[data-filter="HIGH"] { color: var(--high); border-bottom-color: var(--high); }
  .filter-btn.active[data-filter="MEDIUM"] { color: var(--medium); border-bottom-color: var(--medium); }
  .filter-btn.active[data-filter="MONITOR"] { color: var(--monitor); border-bottom-color: var(--monitor); }

  /* ── BOARD ── */
  main {
    padding: 12px 12px 100px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── CARD (full tap target) ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 5px solid;
    cursor: pointer;
    position: relative;
    animation: fadeIn 0.18s ease;
    transition: background 0.12s;
    -webkit-user-select: none;
    user-select: none;
  }

  .card:active { background: #161b24; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card[data-priority="CRITICAL"] { border-left-color: var(--critical); }
  .card[data-priority="HIGH"]     { border-left-color: var(--high); }
  .card[data-priority="MEDIUM"]   { border-left-color: var(--medium); }
  .card[data-priority="MONITOR"]  { border-left-color: var(--monitor); }
  .card.resolved { opacity: 0.38; filter: grayscale(0.5); }

  .card-inner {
    padding: 13px 14px 10px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .card-name {
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .priority-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    padding: 3px 7px;
    border: 1px solid;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .card[data-priority="CRITICAL"] .priority-badge { color: var(--critical); border-color: var(--critical); background: rgba(255,45,45,0.08); }
  .card[data-priority="HIGH"]     .priority-badge { color: var(--high);     border-color: var(--high);     background: rgba(255,140,0,0.08); }
  .card[data-priority="MEDIUM"]   .priority-badge { color: var(--medium);   border-color: var(--medium);   background: rgba(245,196,0,0.08); }
  .card[data-priority="MONITOR"]  .priority-badge { color: var(--monitor);  border-color: var(--monitor);  background: rgba(0,194,255,0.08); }

  .card-issue {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 4px;
  }

  .card-status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.4;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 14px;
    border-top: 1px solid var(--border);
    background: var(--dim);
  }

  .card-ts {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
  }

  /* resolved label on resolved cards */
  .card.resolved .priority-badge::before { content: '✓ '; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty-state .big  { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.1em; margin-bottom: 6px; }
  .empty-state .small { font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; letter-spacing: 0.15em; }

  /* ── FAB ── */
  .fab {
    position: fixed;
    bottom: calc(22px + var(--safe-bottom));
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--text);
    color: var(--bg);
    border: none;
    font-size: 2rem;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    transition: transform 0.15s, opacity 0.15s;
    line-height: 1;
    padding-bottom: 2px;
  }
  .fab:active { transform: scale(0.92); opacity: 0.85; }

  /* ── DETAIL SHEET (slide up) ── */
  .sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 400;
    align-items: flex-end;
  }
  .sheet-overlay.open { display: flex; }

  .sheet {
    background: var(--surface);
    border-top: 2px solid var(--border);
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 0 0 calc(20px + var(--safe-bottom));
    animation: slideUp 0.22s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .sheet-handle {
    display: flex;
    justify-content: center;
    padding: 12px 0 6px;
  }
  .sheet-handle::after {
    content: '';
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
  }

  .sheet-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 18px 14px;
    border-bottom: 1px solid var(--border);
  }

  .sheet-name {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .sheet-body {
    padding: 16px 18px;
  }

  .field-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .field-value {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .field-value.mono {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* edit form inside sheet */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--dim);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 11px 12px;
    outline: none;
    appearance: none;
    border-radius: 0;
    transition: border-color 0.15s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--muted); }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.4; }
  .form-group select option { background: var(--surface); }

  .sheet-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 18px;
    margin-top: 8px;
  }

  .btn-row { display: flex; gap: 10px; }

  .btn-save {
    flex: 1;
    background: var(--text);
    color: var(--bg);
    border: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-save:active { opacity: 0.8; }

  .btn-secondary {
    flex: 1;
    background: var(--dim);
    color: var(--muted);
    border: 1px solid var(--border);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .btn-secondary:active { color: var(--text); }

  .btn-resolve {
    width: 100%;
    background: none;
    border: 1px solid #00c875;
    color: #00c875;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-resolve:active { background: rgba(0,200,117,0.1); }
  .btn-resolve.reopen { border-color: var(--muted); color: var(--muted); }

  .btn-delete {
    width: 100%;
    background: none;
    border: 1px solid rgba(255,45,45,0.3);
    color: rgba(255,45,45,0.6);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px;
    cursor: pointer;
    margin-top: 4px;
    transition: all 0.15s;
  }
  .btn-delete:active { color: var(--critical); border-color: var(--critical); }

  /* view vs edit mode in sheet */
  .edit-mode { display: none; }
  .view-mode { display: block; }
  .sheet.editing .view-mode { display: none; }
  .sheet.editing .edit-mode { display: block; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Gattitown Issues</h1>
    <div class="clock" id="live-clock"></div>
  </div>
  <div class="stat-row">
    <div class="stat-pill c"><div class="num" id="count-critical">0</div><div class="lbl">Critical</div></div>
    <div class="stat-pill h"><div class="num" id="count-high">0</div><div class="lbl">High</div></div>
    <div class="stat-pill m"><div class="num" id="count-medium">0</div><div class="lbl">Medium</div></div>
    <div class="stat-pill w"><div class="num" id="count-monitor">0</div><div class="lbl">Monitor</div></div>
  </div>
</header>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="ALL"     onclick="setFilter('ALL',this)">All</button>
  <button class="filter-btn"        data-filter="CRITICAL" onclick="setFilter('CRITICAL',this)">Critical</button>
  <button class="filter-btn"        data-filter="HIGH"     onclick="setFilter('HIGH',this)">High</button>
  <button class="filter-btn"        data-filter="MEDIUM"   onclick="setFilter('MEDIUM',this)">Medium</button>
  <button class="filter-btn"        data-filter="MONITOR"  onclick="setFilter('MONITOR',this)">Monitor</button>
</div>

<main id="board"></main>

<!-- FAB -->
<button class="fab" onclick="openNew()" aria-label="Add Issue">+</button>

<!-- Detail / Edit Sheet -->
<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <div class="sheet-name" id="sheet-name">—</div>
      <div class="priority-badge" id="sheet-badge">—</div>
    </div>

    <div class="sheet-body">

      <!-- VIEW MODE -->
      <div class="view-mode">
        <div class="field-label">Issue</div>
        <div class="field-value" id="view-issue">—</div>
        <div class="field-label">Status / Action Taken</div>
        <div class="field-value mono" id="view-status">—</div>
        <div class="field-label">Logged</div>
        <div class="field-value mono" id="view-ts">—</div>
      </div>

      <!-- EDIT MODE -->
      <div class="edit-mode">
        <div class="form-group">
          <label>Machine / Equipment Name</label>
          <input type="text" id="f-name" placeholder="e.g. Mario Kart">
        </div>
        <div class="form-group">
          <label>Issue Description</label>
          <textarea id="f-issue" placeholder="What's wrong?"></textarea>
        </div>
        <div class="form-group">
          <label>Status / Action Taken</label>
          <input type="text" id="f-status" placeholder="e.g. Parts ordered, Out of service">
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="f-priority">
            <option value="CRITICAL">Critical — Down, revenue impact or safety</option>
            <option value="HIGH">High — Down or major malfunction</option>
            <option value="MEDIUM">Medium — Degraded, still operable</option>
            <option value="MONITOR">Monitor — Minor issue, watch it</option>
          </select>
        </div>
      </div>

    </div><!-- /sheet-body -->

    <div class="sheet-actions">

      <!-- VIEW actions -->
      <div class="view-mode btn-row">
        <button class="btn-secondary" onclick="switchToEdit()">EDIT</button>
        <button class="btn-secondary" onclick="closeSheet()">CLOSE</button>
      </div>
      <button class="btn-resolve view-mode" id="btn-resolve" onclick="resolveFromSheet()">MARK RESOLVED</button>
      <button class="btn-delete view-mode" onclick="deleteFromSheet()">DELETE ISSUE</button>

      <!-- EDIT actions -->
      <div class="edit-mode btn-row">
        <button class="btn-secondary" onclick="cancelEdit()">CANCEL</button>
        <button class="btn-save" onclick="saveIssue()">SAVE</button>
      </div>

    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'gattitown_issues_v1';
  let issues = [];
  let currentFilter = 'ALL';
  let activeId = null;  // which issue is open in sheet
  let isNew = false;

  const defaultIssues = [
    { id: uid(), name: 'Tons of Tickets',  issue: 'Ticket payout mechanism failure — unit is over-dispensing tickets.',   status: 'Under investigation.',                         priority: 'CRITICAL', resolved: false, ts: Date.now() - 1000*60*30 },
    { id: uid(), name: 'Mario Kart',       issue: 'Worn drive belt and loose hardware components.',                         status: 'Scheduled for repair.',                        priority: 'HIGH',     resolved: false, ts: Date.now() - 1000*60*45 },
    { id: uid(), name: 'E-Claw',           issue: 'Cable fault and motherboard requires full rewire.',                      status: 'Awaiting parts / rewire.',                     priority: 'HIGH',     resolved: false, ts: Date.now() - 1000*60*60 },
    { id: uid(), name: 'Ice Ball 2',       issue: 'Motherboard failure.',                                                   status: 'Motherboard removed and sent out for repair.', priority: 'HIGH',     resolved: false, ts: Date.now() - 1000*60*90 },
    { id: uid(), name: 'SpongeBob VR',     issue: 'Intermittent headset connection drops and charging issues.',             status: 'Unit operational — monitoring headset hardware.', priority: 'MEDIUM', resolved: false, ts: Date.now() - 1000*60*20 },
  ];

  function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function load() {
    try { const r = localStorage.getItem(STORAGE_KEY); issues = r ? JSON.parse(r) : defaultIssues; }
    catch { issues = defaultIssues; }
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(issues)); }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  const priorityOrder = { CRITICAL:0, HIGH:1, MEDIUM:2, MONITOR:3 };

  function render() {
    const board = document.getElementById('board');
    const counts = { CRITICAL:0, HIGH:0, MEDIUM:0, MONITOR:0 };
    issues.forEach(i => { if (!i.resolved) counts[i.priority]++; });
    document.getElementById('count-critical').textContent = counts.CRITICAL;
    document.getElementById('count-high').textContent     = counts.HIGH;
    document.getElementById('count-medium').textContent   = counts.MEDIUM;
    document.getElementById('count-monitor').textContent  = counts.MONITOR;

    let list = [...issues].sort((a,b) => {
      if (a.resolved !== b.resolved) return a.resolved ? 1 : -1;
      return (priorityOrder[a.priority] - priorityOrder[b.priority]) || (b.ts - a.ts);
    });
    if (currentFilter !== 'ALL') list = list.filter(i => i.priority === currentFilter);

    if (!list.length) {
      board.innerHTML = `<div class="empty-state"><div class="big">ALL CLEAR</div><div class="small">No issues${currentFilter!=='ALL'?' at this priority':''}</div></div>`;
      return;
    }

    board.innerHTML = list.map(issue => `
      <div class="card ${issue.resolved?'resolved':''}" data-priority="${issue.priority}" data-id="${issue.id}" onclick="openSheet('${issue.id}')">
        <div class="card-inner">
          <div class="card-top">
            <div class="card-name">${esc(issue.name)}</div>
            <div class="priority-badge">${issue.resolved ? '✓ ' : ''}${issue.priority}</div>
          </div>
          <div class="card-issue">${esc(issue.issue)}</div>
          <div class="card-status">${esc(issue.status)}</div>
        </div>
        <div class="card-footer">
          <div class="card-ts">${formatTs(issue.ts)}</div>
          <div class="card-ts" style="color:var(--border)">TAP TO OPEN ›</div>
        </div>
      </div>
    `).join('');
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function formatTs(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' +
           d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  }

  /* ── SHEET ── */
  function openSheet(id) {
    activeId = id;
    isNew = false;
    const issue = issues.find(i => i.id === id);
    if (!issue) return;

    // populate view
    document.getElementById('sheet-name').textContent  = issue.name;
    document.getElementById('sheet-badge').textContent = issue.priority;
    document.getElementById('view-issue').textContent  = issue.issue;
    document.getElementById('view-status').textContent = issue.status || '—';
    document.getElementById('view-ts').textContent     = formatTs(issue.ts);

    // set badge colour class
    const sheet = document.getElementById('sheet');
    sheet.dataset.priority = issue.priority;
    document.getElementById('sheet-badge').className = 'priority-badge';

    // resolve button label
    const rb = document.getElementById('btn-resolve');
    rb.textContent = issue.resolved ? 'REOPEN' : 'MARK RESOLVED';
    rb.className   = 'btn-resolve view-mode' + (issue.resolved ? ' reopen' : '');

    // make sure we're in view mode
    sheet.classList.remove('editing');
    document.getElementById('sheet-overlay').classList.add('open');
  }

  function openNew() {
    activeId = null;
    isNew = true;
    // clear form
    document.getElementById('f-name').value    = '';
    document.getElementById('f-issue').value   = '';
    document.getElementById('f-status').value  = '';
    document.getElementById('f-priority').value = 'HIGH';

    document.getElementById('sheet-name').textContent  = 'New Issue';
    document.getElementById('sheet-badge').textContent = '';

    const sheet = document.getElementById('sheet');
    sheet.classList.add('editing');
    document.getElementById('sheet-overlay').classList.add('open');
    setTimeout(() => document.getElementById('f-name').focus(), 300);
  }

  function closeSheet() {
    document.getElementById('sheet-overlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('editing');
    activeId = null;
    isNew = false;
  }

  function switchToEdit() {
    const issue = issues.find(i => i.id === activeId);
    if (!issue) return;
    document.getElementById('f-name').value     = issue.name;
    document.getElementById('f-issue').value    = issue.issue;
    document.getElementById('f-status').value   = issue.status;
    document.getElementById('f-priority').value = issue.priority;
    document.getElementById('sheet').classList.add('editing');
    setTimeout(() => document.getElementById('f-name').focus(), 100);
  }

  function cancelEdit() {
    if (isNew) { closeSheet(); return; }
    document.getElementById('sheet').classList.remove('editing');
  }

  function saveIssue() {
    const name     = document.getElementById('f-name').value.trim();
    const issue    = document.getElementById('f-issue').value.trim();
    const status   = document.getElementById('f-status').value.trim();
    const priority = document.getElementById('f-priority').value;
    if (!name || !issue) { document.getElementById('f-name').focus(); return; }

    if (isNew) {
      const newIssue = { id: uid(), name, issue, status, priority, resolved: false, ts: Date.now() };
      issues.unshift(newIssue);
      activeId = newIssue.id;
      isNew = false;
    } else {
      const idx = issues.findIndex(i => i.id === activeId);
      if (idx !== -1) issues[idx] = { ...issues[idx], name, issue, status, priority };
    }

    save();
    // refresh view in sheet
    const updated = issues.find(i => i.id === activeId);
    document.getElementById('sheet-name').textContent  = updated.name;
    document.getElementById('sheet-badge').textContent = updated.priority;
    document.getElementById('view-issue').textContent  = updated.issue;
    document.getElementById('view-status').textContent = updated.status || '—';
    document.getElementById('sheet').classList.remove('editing');
    render();
  }

  function resolveFromSheet() {
    const idx = issues.findIndex(i => i.id === activeId);
    if (idx === -1) return;
    issues[idx].resolved = !issues[idx].resolved;
    save();
    render();
    openSheet(activeId); // refresh sheet state
  }

  function deleteFromSheet() {
    if (!activeId) return;
    issues = issues.filter(i => i.id !== activeId);
    save();
    closeSheet();
    render();
  }

  // tap overlay to close
  document.getElementById('sheet-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeSheet();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // clock
  function updateClock() {
    const n = new Date();
    document.getElementById('live-clock').innerHTML =
      n.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) + '<br>' +
      n.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  load();
  render();

  // Register service worker for PWA offline support
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
