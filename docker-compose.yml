services:
  gattitown:
    build: .
    container_name: gattitown
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${PHOTOS_PATH:-./data/photos}:/data/photos
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PHOTOS_DIR=/data/photos
    restart: unless-stopped
